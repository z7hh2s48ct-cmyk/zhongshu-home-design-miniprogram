# RG1/R06: use --spring.profiles.active=pg,prod. Never combine with local/dev/zsdev.
# Secrets and endpoints are supplied by deployment; no production fallback credentials.
spring:
  task:
    scheduling:
      pool:
        size: 8
  data:
    redis:
      host: ${ZS_REDIS_HOST}
      port: ${ZS_REDIS_PORT:6379}
      password: ${ZS_REDIS_PASSWORD}
  datasource:
    druid:
      stat-view-servlet:
        enabled: false
      web-stat-filter:
        enabled: false
    dynamic:
      primary: master
      datasource:
        master:
          url: ${ZS_PG_URL}
          username: ${ZS_PG_USERNAME}
          password: ${ZS_PG_PASSWORD}
          driver-class-name: org.postgresql.Driver
  flyway:
    url: ${ZS_PG_URL}
    user: ${ZS_PG_USERNAME}
    password: ${ZS_PG_PASSWORD}
yudao:
  security:
    mock-enable: false
zhongshu:
  privacy:
    export-worker-enabled: true
    retention-policy-version: ${ZS_PRIVACY_RETENTION_POLICY_VERSION:}
  support:
    phone: ${ZS_SUPPORT_PHONE:}
    wecom-corp-id: ${ZS_SUPPORT_WECOM_CORP_ID:}
    wecom-url: ${ZS_SUPPORT_WECOM_URL:}
    help-url: ${ZS_SUPPORT_HELP_URL:}
  identity:
    wechat:
      provider: real
  commerce:
    payment:
      provider: real
      wechat:
        merchant-id: ${ZS_PAY_MERCHANT_ID}
        merchant-serial-no: ${ZS_PAY_MERCHANT_SERIAL_NO}
        api-v3-key: ${ZS_PAY_API_V3_KEY}
        merchant-private-key-path: ${ZS_PAY_MERCHANT_PRIVATE_KEY_PATH}
        notify-url: ${ZS_PAY_NOTIFY_URL}
        refund-notify-url: ${ZS_PAY_REFUND_NOTIFY_URL}
  design:
    driver-enabled: true
    refund-recovery-enabled: true
    export-worker-enabled: true
    seed-dev-data: false
    asset:
      validation-worker-enabled: true
      dev-content-endpoint: false
      storage:
        provider: cos
      moderation:
        provider: real
        secret-id: ${ZS_MODERATION_SECRET_ID}
        secret-key: ${ZS_MODERATION_SECRET_KEY}
        region: ${ZS_MODERATION_REGION:ap-guangzhou}
        biz-type: ${ZS_MODERATION_BIZ_TYPE}
        daily-limit: ${ZS_MODERATION_DAILY_LIMIT}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    env:
      show-values: NEVER
    configprops:
      show-values: NEVER
